name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: refrigerator
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: refrigerator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Static export lands in dist/client/<basePath>; the site root is that folder.
      - run: |
          site="dist/client${PAGES_BASE_PATH}"
          cp dist/client/404.html "$site/404.html"
          touch "$site/.nojekyll"
          echo "SITE_DIR=refrigerator/$site" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
